name: quds_office_engine
description: >-
  Pure Dart Office Open XML engine for DOCX, XLSX, PPTX, OPC/ZIP,
  Excel formulas, RTL/BiDi, and native PDF 1.7 — no Flutter.
version: 0.1.0
homepage: https://github.com/MohammedAsaadAsaad/quds_office_suite
repository: https://github.com/MohammedAsaadAsaad/quds_office_suite
issue_tracker: https://github.com/MohammedAsaadAsaad/quds_office_suite/issues
documentation: https://pub.dev/documentation/quds_office_engine/latest/
resolution: workspace

topics:
  - office
  - docx
  - xlsx
  - pptx
  - pdf

environment:
  sdk: ^3.12.0

dependencies:
  crypto: ^3.0.7

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
