name: quds_office_engine
description: >-
  Pure Dart Office + PDF engine: DOCX, XLSX, PPTX, formulas, BiDi/RTL,
  PdfFile, pdf_widgets, 100+ report templates, and PDF 1.7 — no Flutter.
version: 0.5.2
homepage: https://github.com/MohammedAsaadAsaad/quds_office_suite
repository: https://github.com/MohammedAsaadAsaad/quds_office_suite
issue_tracker: https://github.com/MohammedAsaadAsaad/quds_office_suite/issues
resolution: workspace

topics:
  - office
  - docx
  - xlsx
  - pptx
  - pdf

screenshots:
  - description: "PDF widgets — invoice composed with Document / Table / MultiPage."
    path: example/screenshots/pdf_widgets.png
  - description: "Office → PDF — RTL formal letter exported to PDF 1.7."
    path: example/screenshots/office_rtl.png

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.12.0

dependencies:
  crypto: ^3.0.7

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
