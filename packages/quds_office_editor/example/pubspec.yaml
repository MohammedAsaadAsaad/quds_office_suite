name: quds_office_studio
description: Full Office workspace demo hosted on quds_office_editor.
publish_to: none
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  file_picker: ^10.3.10
  flutter:
    sdk: flutter
  quds_office_editor:
    path: ..
  quds_office_engine:
    path: ../../quds_office_engine
  window_manager: ^0.5.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/al_tahreer/
    - fonts/
