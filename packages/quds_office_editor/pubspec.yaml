name: quds_office_editor
description: >-
  Flutter Office + PDF surfaces on custom RenderBox: Word, Excel, PowerPoint,
  and QudsPdfViewer/Editor — IME, BiDi, formulas, slideshows, PDF markup.
version: 0.4.0
homepage: https://github.com/MohammedAsaadAsaad/quds_office_suite
repository: https://github.com/MohammedAsaadAsaad/quds_office_suite
issue_tracker: https://github.com/MohammedAsaadAsaad/quds_office_suite/issues
resolution: workspace

topics:
  - flutter
  - office
  - editor
  - pdf
  - word

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

screenshots:
  - description: "Word canvas — paginated pages, BiDi caret, and custom chrome."
    path: example/screenshots/word.png
  - description: "Excel grid — virtualized sheet, formula bar, and freeze panes."
    path: example/screenshots/excel.png
  - description: "PowerPoint stage — shapes, snap guides, and slideshow."
    path: example/screenshots/powerpoint.png
  - description: "PDF surface — invoice page from pdf_widgets in the Studio gallery."
    path: example/screenshots/pdf.png

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  quds_office_engine: ^0.4.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: false
  assets:
    - fonts/
