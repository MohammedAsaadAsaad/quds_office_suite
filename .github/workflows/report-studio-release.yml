name: Report Studio release

# Builds Quds Report Studio installers and attaches them to a GitHub release.
# Push a `studio-vX.Y.Z` tag (or run manually with that tag) to publish.
on:
  push:
    tags: ['studio-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (studio-vX.Y.Z)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  linux:
    name: Linux (.deb + tar.gz)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apps/quds_report_studio
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve workspace
        working-directory: .
        run: flutter pub get
      - run: flutter build linux --release
      - run: bash packaging/linux/build_packages.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: studio-linux
          path: apps/quds_report_studio/dist/*
          if-no-files-found: error

  windows:
    name: Windows (setup.exe + portable zip)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: apps/quds_report_studio
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve workspace
        working-directory: .
        run: flutter pub get
      - run: flutter build windows --release
      - name: Install Inno Setup 6.7.3
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installer
          Start-Process -Wait -FilePath $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$env:RUNNER_TEMP\inno"
          if (-not (Test-Path "$env:RUNNER_TEMP\inno\ISCC.exe")) { throw 'ISCC.exe was not installed' }
      - name: Package
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          $release = Join-Path $PWD 'build\windows\x64\runner\Release'
          $dist = Join-Path $PWD 'dist'
          New-Item -ItemType Directory -Force $dist | Out-Null
          # App-local VC++ runtime so the studio starts without the redistributable.
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" $release
          }
          & "$env:RUNNER_TEMP\inno\ISCC.exe" /Qp "/DAppVersion=$version" "/DSourceDir=$release" "/DOutputDir=$dist" packaging\windows\quds_report_studio.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $name = "QudsReportStudio-$version-windows-x64"
          $stage = Join-Path $env:RUNNER_TEMP $name
          Copy-Item $release $stage -Recurse
          Copy-Item packaging\windows\unregister-qrep.cmd $stage
          Compress-Archive -Path $stage -DestinationPath (Join-Path $dist "$name-portable.zip")
          Get-ChildItem $dist
      - uses: actions/upload-artifact@v4
        with:
          name: studio-windows
          path: apps/quds_report_studio/dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          version="${TAG#studio-v}"
          base="https://github.com/${GH_REPO}/releases/download/${TAG}"
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          Desktop designer for \`.qrep\` band reports, built on
          [quds_office_engine](https://pub.dev/packages/quds_office_engine) and
          [quds_office_editor](https://pub.dev/packages/quds_office_editor).

          | Platform | Installer | Portable |
          | --- | --- | --- |
          | Windows x64 | [setup.exe](${base}/QudsReportStudio-${version}-windows-x64-setup.exe) | [zip](${base}/QudsReportStudio-${version}-windows-x64-portable.zip) |
          | Linux x64 | [.deb](${base}/quds-report-studio_${version}_amd64.deb) | [tar.gz](${base}/QudsReportStudio-${version}-linux-x64.tar.gz) |

          - **Windows:** run the setup (no admin needed); uninstall from *Settings → Apps*.
            The portable zip runs in place; \`unregister-qrep.cmd\` removes its file association.
          - **Debian/Ubuntu:** \`sudo apt install ./quds-report-studio_${version}_amd64.deb\`;
            remove with \`sudo apt remove quds-report-studio\`.
          - **Other Linux:** extract the tar.gz and run \`./install.sh\` (per user, no root);
            \`~/.local/opt/quds-report-studio/uninstall.sh\` removes it.

          On its first run the studio registers itself as the app for \`.qrep\` files,
          so double-clicking a report opens it in the studio.
          Checksums: [SHA256SUMS.txt](${base}/SHA256SUMS.txt).
          EOF
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "Quds Report Studio $version" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release upload "$TAG" --clobber -- *
