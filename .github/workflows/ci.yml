name: CI

on:
  push:
    branches: [main]
  pull_request:

# The pub workspace contains Flutter packages, so every job resolves it with
# the Flutter SDK (which bundles Dart). The engine itself stays pure Dart.
jobs:
  engine:
    name: quds_office_engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/quds_office_engine
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve workspace
        working-directory: .
        run: flutter pub get
      - run: dart analyze --fatal-infos
      - run: dart test

  editor:
    name: quds_office_editor
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/quds_office_editor
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve workspace
        working-directory: .
        run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  report_studio:
    name: quds_report_studio
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/quds_report_studio
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve workspace
        working-directory: .
        run: flutter pub get
      - run: flutter analyze
      - run: flutter test
